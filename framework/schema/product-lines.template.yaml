# Template per product/reference/product-lines.yaml
#
# Popolato durante l'inizializzazione dell'istanza (skill
# init-governance-project). Ogni idea deve referenziare uno di questi
# 'name' nel proprio campo product_line.
#
# reach_denominator: il playbook è esplicito su questo — finché il
# denominatore non è dichiarato con una fonte e un owner, il Reach
# normalizzato di ogni RICE su questa product line resta un'approssimazione
# e va trattato come tale nelle decisioni di priorità. Non calcolarlo "a
# occhio" ogni volta: va mantenuto qui come dato di riferimento condiviso.
# Serve a ricavare la PERCENTUALE sulla popolazione; quella percentuale
# poi alimenta la banda 1-10 di Reach (rice_history.reach_points =
# max(1, ceil(%/10))), non è il valore finale dello score.

- name: ""
  description: ""
  nsm: []                           # North Star Metric + eventuali altri KPI di riferimento
  stakeholders: []                  # nomi (o ruoli) dei referenti principali
  reach_denominator:
    value: null
    source: null                    # es. "DataBricks", "HR system export"
    owner: null                     # chi è responsabile di tenerlo aggiornato
  # Dashboard dei path da monitorare di questa linea (skill path-watch,
  # passo 6b) — solo con una fonte analytics collegata e
  # metrics.paths.write.dashboards.enabled non false. Mostra la NSM (se ha
  # un oggetto nel catalogo) e un grafico per path active delle idee
  # attive della linea, riallineata a ogni giro di path-watch. Scritto da
  # path-watch, scrittura diretta: è un fatto di configurazione, non una
  # decisione. Il framework gestisce SOLO i grafici in managed_charts;
  # quelli messi da altri sulla stessa dashboard non si toccano.
  analytics_dashboard:
    ref: null                       # id/link della dashboard nel tool — creata da path-watch, oppure una esistente indicata dal PM
    created_by_framework: false
    last_synced_at: null
    managed_charts: []              # [{chart_ref, source: "{idea_id}#{path_id}" | "nsm"}] — i soli grafici che path-watch aggiunge/riordina/toglie
    changes: []                     # APPEND-ONLY, stessa forma di analytics_changes in idea.yaml: at, action, reversible, before (versione del tool o lista completa di grafici e layout), confirmed_by, reverted_at
