# Template per product/ceremonies/{tipo}/{settimana-o-data}/decisions.yaml
#
# Ogni cerimonia collettiva (Backlog Refinement, Roadmap Update & Iteration
# Planning, ecc.) produce discussione qualitativa che va tracciata: la
# trascrizione grezza sta in source/, qui va l'esito strutturato — cosa è
# stato deciso e cosa quella decisione ha impattato altrove nel repo.
#
# tipo tipico: backlog-refinement | roadmap-iteration-planning |
#              measurement-retro | strategic-exception-review | other
# (le discussioni di RICE scoring legate a UNA singola idea vivono invece
# dentro product/ideas/{slug}/source/, non qui — sono 1:1 con un'idea,
# non un rito ricorrente del team.)

ceremony_type: backlog-refinement
period: "2026-W02"                 # settimana ISO, o data per cerimonie non settimanali
date: "2026-01-08"
facilitator: ""
participants: []

source_ref: "source/trascrizione.md"   # pointer al materiale grezzo nella stessa cartella

# Cosa è stato deciso in questa cerimonia — lista di decisioni atomiche,
# ciascuna con riferimento a cosa ha impattato nel repo (nessuna scrittura
# diretta: se una decisione qui cambia un RICE o produce uno snapshot di
# roadmap, il cambiamento passa comunque da product/approvals/pending/).
decisions:
  - summary: ""
    impacts:
      idea_ids: []                 # eventuali idee la cui priorità/RICE è stata ridiscussa
      roadmap_snapshot: null        # es. "roadmap/snapshots/2026-W02.yaml", se questa cerimonia lo ha generato
      approval_id: null             # id della voce in product/approvals/pending/ (o decided/) generata da questa decisione

retro_notes: ""                    # es. % completamento iterazione precedente, impedimenti — solo per backlog-refinement

# --- Solo per ceremony_type: backlog-refinement ---
#
# Riferimento alla proposta di Piano di Iterazione generata da questa
# cerimonia (product/approvals/pending/{settimana}-iteration-plan.yaml) —
# l'OUTPUT PRIMARIO del Backlog Refinement. Resta pending finché non
# approvata via pending-approval; a quel punto diventa
# product/roadmap/iterations/{settimana}.yaml. È il campo leggibile dalla
# cerimonia, non il piano stesso (che vive nel suo file).
iteration_plan_ref: null

# --- Solo per ceremony_type: backlog-refinement ---
#
# La cerimonia cammina la coda product/approvals/pending/ (i rice_diff in
# particolare) con il team: qui va la traccia di cosa è stato deciso su
# ciascuna voce. Le approvazioni/rifiuti veri li applica pending-approval
# (che sposta i file in decided/); questo campo è il riferimento
# leggibile dalla cerimonia.
approvals_reviewed: []
# Esempio di singola voce:
# - approval_id: "2026-W02-idea-xyz-rice.yaml"
#   idea_ref: "PG-042"
#   decision: approved          # approved | rejected | deferred
#   note: ""                    # motivo se rejected/deferred; per un batch storico: "primo scoring intake bulk del {data}"

# --- Solo per ceremony_type: backlog-refinement ---
#
# Ogni volta che un'iniziativa entra nell'iterazione corrente saltando
# davanti a idee con RICE score più alto ancora in backlog, la skill
# backlog-refinement chiede esplicitamente: è una Strategic Exception (bypass
# su autorizzazione di uno stakeholder) o una scelta qualitativa fatta
# dal team dentro il processo normale? La distinzione conta: solo la
# prima va tracciata su strategic_exceptions dell'idea e nel friction-log
# per intercettare pattern (playbook, "Come gestire le frizioni" —
# Scenario 2); la seconda resta normale governance del backlog.
#
# Dopo l'introduzione del Piano di Iterazione, questo campo è una VISTA
# leggibile dalla cerimonia delle voci urgent_priority con
# kind: strategic_exception di quel piano (come approvals_reviewed è la
# vista della camminata della coda pending/). La fonte di verità della
# reprioritizzazione è il Piano di Iterazione; qui si annota per non
# doverlo aprire in una revisione.
reprioritizations: []
# Esempio di singola voce:
# - idea_id: "2026-01-08-slug-esistente"
#   expected_rank_note: "era 8° per RICE score nel backlog, entra ora al 2° posto dell'iterazione"
#   reason_type: strategic_exception    # strategic_exception | qualitative_team_call
#   reason: ""                          # perché, in entrambi i casi
#   strategic_exception_approved_by: null   # solo se reason_type: strategic_exception — "CEO" | "CPO/CTO" | null finché non confermato
