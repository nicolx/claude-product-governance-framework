# Template per product/approvals/pending/{id}.yaml
#
# Meccanismo UNICO di "pending approval": usato sia per i diff di roadmap/
# RICE proposti automaticamente, sia per ogni comunicazione in uscita
# (mail settimanale, roadmap trimestrale). Nulla viene applicato o inviato
# senza revisione umana esplicita — l'automazione propone, non decide.
#
# Ciclo di vita: una skill scrive qui con decision: pending. Un umano
# rivede payload (e target_file, se presente) e:
#   - approva  -> la skill applica il payload a target_file (se presente),
#                 poi SPOSTA questo file in product/approvals/decided/
#   - rifiuta  -> nessuna scrittura su target_file, il file si sposta
#                 comunque in decided/ con decision: rejected (per audit)

id: "2026-01-08-slug-descrittivo"
type: rice_diff                     # rice_diff | roadmap_snapshot | iteration_plan | outbound_comm | strategic_exception_flag | mandate_update | mandate_reclassification | context_update
proposed_at: "2026-01-08"
proposed_by: ""                     # nome della skill che ha generato la proposta (es. rice-update, roadmap-snapshot, backlog-refinement)

# Cosa verrebbe applicato se approvato. Forma libera in base a 'type':
# - rice_diff: la nuova voce da appendere a rice_history di un'idea
# - roadmap_snapshot: il contenuto completo del nuovo snapshot
# - iteration_plan: il contenuto completo del Piano di Iterazione della
#   settimana (framework/schema/iteration-plan.template.yaml) — output
#   primario del Backlog Refinement. All'approvazione, pending-approval
#   scrive il file in product/roadmap/iterations/{settimana}.yaml E, per
#   ogni idea in un bucket del piano, il puntatore denormalizzato
#   iteration.current/iteration.bucket sul suo idea.yaml (azzerandolo per
#   le idee che erano nel piano based_on e non compaiono più). target_file
#   punta al file di iterazione.
# - outbound_comm: oggetto + corpo della comunicazione, e a chi
# - strategic_exception_flag: la nuova voce da appendere a
#   strategic_exceptions di un'idea (es. invoked_at_stage:
#   backlog_refinement, rilevata da backlog-refinement durante il Backlog
#   Refinement — vedi framework/schema/idea.template.yaml)
# - mandate_update: i nuovi valori per due_date/lead_time_weeks/
#   mandated_by/rationale/is_critical sul blocco mandate di un'idea —
#   SOLO per modifiche dopo la creazione iniziale (la creazione stessa
#   non passa da qui, è cattura non decisione). Non include mai
#   analysis_start_by/escalation_status: quelli sono calcolati da
#   mandate-watch e scritti direttamente, non proposti.
# - mandate_reclassification: per un'idea/strategic_exception già
#   esistente la cui scadenza (blocco `deadline`, tipicamente segnalata
#   da deadline-watch) si rivela soddisfare davvero la definizione di
#   Iniziativa Mandataria. Payload: `classification: mandate` più i
#   valori iniziali del blocco `mandate` (mandated_by, rationale,
#   is_critical, due_date, lead_time_weeks). rice_history NON viene
#   toccato — resta come storico, append-only.
# - context_update: un cambiamento MATERIALE del contesto aziendale
#   rilevato da context-watch in un documento di una cartella collegata —
#   uno che cambierebbe come si scrivono i PRD / l'evoluzione del prodotto
#   (pivot di business model, NSM ridefinita, vincolo regolatorio nuovo,
#   riposizionamento, riorg che sposta l'ownership di prodotto). Gli
#   aggiornamenti di ROUTINE non passano da qui: context-watch li applica
#   direttamente. Payload: link del documento sorgente, sintesi del
#   cambiamento, la trascrizione (o il diff) proposta sul context/*.md, e
#   il razionale di materialità. target_file = il context/*.md
#   interessato. All'approvazione, pending-approval invoca context-intake
#   per scrivere la trascrizione e aggiornare context/.sources-seen.yaml.
payload: {}

target_file: null                   # es. "product/ideas/2026-01-08-slug/idea.yaml" — null per outbound_comm; per context_update: il "context/<argomento>.md"

decision: pending                   # pending | approved | rejected
decided_by: null
decided_at: null
notes: null
