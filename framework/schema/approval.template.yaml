# Template per product/approvals/pending/{id}.yaml
#
# Meccanismo UNICO di "pending approval": usato sia per i diff di roadmap/
# RICE proposti automaticamente, sia per ogni comunicazione in uscita
# (mail settimanale, roadmap trimestrale). Nulla viene applicato o inviato
# senza revisione umana esplicita — l'automazione propone, non decide.
#
# Ciclo di vita: una skill scrive qui con decision: pending. Un umano
# rivede payload (e target_file, se presente) e:
#   - approva  -> la skill applica il payload a target_file (se presente),
#                 poi SPOSTA questo file in product/approvals/decided/
#   - rifiuta  -> nessuna scrittura su target_file, il file si sposta
#                 comunque in decided/ con decision: rejected (per audit)

id: "2026-01-08-slug-descrittivo"
type: rice_diff                     # rice_diff | roadmap_snapshot | outbound_comm | strategic_exception_flag | mandate_update
proposed_at: "2026-01-08"
proposed_by: ""                     # nome della skill che ha generato la proposta (es. rice-update, log-ceremony)

# Cosa verrebbe applicato se approvato. Forma libera in base a 'type':
# - rice_diff: la nuova voce da appendere a rice_history di un'idea
# - roadmap_snapshot: il contenuto completo del nuovo snapshot
# - outbound_comm: oggetto + corpo della comunicazione, e a chi
# - strategic_exception_flag: la nuova voce da appendere a
#   strategic_exceptions di un'idea (es. invoked_at_stage:
#   backlog_refinement, rilevata da log-ceremony durante il Backlog
#   Refinement — vedi framework/schema/idea.template.yaml)
# - mandate_update: i nuovi valori per due_date/lead_time_weeks/
#   mandated_by/rationale/is_critical sul blocco mandate di un'idea —
#   SOLO per modifiche dopo la creazione iniziale (la creazione stessa
#   non passa da qui, è cattura non decisione). Non include mai
#   analysis_start_by/escalation_status: quelli sono calcolati da
#   mandate-watch e scritti direttamente, non proposti.
payload: {}

target_file: null                   # es. "product/ideas/2026-01-08-slug/idea.yaml" — null per outbound_comm

decision: pending                   # pending | approved | rejected
decided_by: null
decided_at: null
notes: null
