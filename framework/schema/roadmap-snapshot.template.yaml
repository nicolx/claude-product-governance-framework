# Template per product/roadmap/snapshots/{YYYY-Www}.yaml
#
# Output della cerimonia di Backlog Refinement (+ conferma della Roadmap
# Update & Iteration Planning). Ogni settimana un nuovo file, mai
# sovrascritto — la serie storica dei file È lo storico dei Gantt
# settimanali citato nel brief.
#
# Va SEMPRE generato/aggiornato passando prima da
# product/approvals/pending/ (tipo roadmap_snapshot) — mai scritto
# direttamente dalla skill roadmap-snapshot.

week: "2026-W02"
generated_at: "2026-01-08"
iteration_goal: ""
ceremony_refs:                      # cerimonie che hanno contribuito a questo snapshot
  - "ceremonies/backlog-refinement/2026-W02"
  - "ceremonies/roadmap-iteration-planning/2026-W02"

initiatives:
  - idea_id: ""
    prd_id: null
    jira_card_id: null
    status: ""                      # libero, riflette lo stato reale (es. "in sviluppo", "bloccato", "shipped 70%")
    completion_pct: null

retro_notes: ""                     # mini-retrospettiva dell'iterazione precedente (facoltativa)

# mandates_status elenca TUTTE le idee classification: mandate ancora
# aperte (status diverso da done/aborted) — non solo quelle già in
# initiatives sopra. È il punto in cui un'iniziativa mandataria diventa
# visibile in un MBR/MTR anche PRIMA di essere entrata in lavorazione:
# se aspettassimo che sia in initiatives per vederla, il rischio di
# scoprire la scadenza troppo tardi resterebbe intatto. Popolato da
# roadmap-snapshot leggendo escalation_status calcolato da mandate-watch
# su ciascuna idea (non ricalcolato qui).
mandates_status:
  - idea_id: ""
    mandated_by: ""
    due_date: null
    analysis_start_by: null
    escalation_status: ""             # pending_review | on_track | due_soon | overdue
    current_status: ""                 # status corrente dell'idea (bucket, in_analysis, ecc.)

# unscored_ideas elenca le idee classification: idea ancora con
# rice_history vuoto — stesso principio di mandates_status: renderle
# visibili anche se non sono ancora in initiatives, perché è esattamente
# lì che si perdono (nessuno le nota finché non è troppo tardi). Popolato
# leggendo rice_status calcolato da rice-watch su ciascuna idea (non
# ricalcolato qui).
unscored_ideas:
  - idea_id: ""
    title: ""
    days_unscored: null                # calcolato al momento dello snapshot, non un campo persistito sull'idea
    status: ""                          # fresh | aging | stale | blocked_on:{waiting_on}
    blocked_reason: null
    waiting_on: null

# measurements_status elenca le KPI delle iniziative già rilasciate
# (idea status: done) che meritano attenzione — non solo check_due/
# at_risk/invalidated, ma la serie storica di questa sezione nel tempo
# (uno snapshot per settimana) È il tracciamento delle metriche su Git
# richiesto per prendere decisioni informate su dove veicolare gli
# investimenti futuri: non serve aspettare un livello derivato/DB per
# iniziare ad accumularlo. Popolato leggendo measurement_status
# calcolato da measurement-watch su ciascun product/prds/*/measurement.yaml
# (non ricalcolato qui). Le KPI concluded non compaiono più qui.
measurements_status:
  - idea_id: ""
    prd_ref: ""
    kpi_name: ""
    weeks_since_done: null
    measurement_status: ""              # check_due | on_track | achieved | at_risk | invalidated | inconclusive
    latest_reading: null
    target: null
