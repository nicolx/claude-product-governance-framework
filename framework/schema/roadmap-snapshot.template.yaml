# Template per product/roadmap/snapshots/{YYYY-Www}.yaml
#
# Output della cerimonia di Backlog Refinement (+ conferma della Roadmap
# Update & Iteration Planning). Ogni settimana un nuovo file, mai
# sovrascritto — la serie storica dei file È lo storico dei Gantt
# settimanali citato nel brief.
#
# Va SEMPRE generato/aggiornato passando prima da
# product/approvals/pending/ (tipo roadmap_snapshot) — mai scritto
# direttamente dalla skill roadmap-snapshot.

# nsm_alerts va per primo nel documento deliberatamente: è il segnale più
# strategico che il framework osserva (playbook, "Salute delle NSM e
# Product Discovery") — più a monte delle singole iniziative. Elenca
# TUTTE le NSM con alert.status diverso da "none" in
# product/reference/nsm-tracking.yaml, non solo quelle rilevate questa
# settimana — finché un allarme resta "active" e non "resolved", deve
# comparire in ogni snapshot, per lo stesso motivo per cui un'iniziativa
# mandataria a rischio non sparisce finché non è risolta. Popolato
# leggendo trend_status/alert calcolati da nsm-watch (non ricalcolato
# qui).
nsm_alerts:
  - product_line: ""
    name: ""
    trend_status: ""                   # degrading | improving | stable | unknown
    alert_status: ""                    # active | resolved
    discovery_focus_confirmed: false
    latest_reading: null
    baseline: null
    target: null

week: "2026-W02"
generated_at: "2026-01-08"
ceremony_refs:                      # cerimonie che hanno contribuito a questo snapshot
  - "ceremonies/backlog-refinement/2026-W02"
  - "ceremonies/roadmap-iteration-planning/2026-W02"

# iteration_plan_ref punta al Piano di Iterazione della settimana
# (product/roadmap/iterations/{settimana}.yaml) — la board operativa
# team-facing con i quattro bucket. Lo snapshot NON la duplica: è il
# rollup strategico per MBR/MTR, il piano è il "cosa fa il team adesso".
iteration_plan_ref: "roadmap/iterations/2026-W02.yaml"

# iteration_goal e initiatives[] sono DERIVATI/OPZIONALI: la fonte è il
# Piano di Iterazione referenziato sopra. iteration_goal si copia da lì.
# initiatives[] serve solo quando un MBR/MTR chiede un elenco piatto delle
# iniziative in lavorazione: in quel caso roadmap-snapshot lo compone
# leggendo i quattro bucket del piano (analysis_todo, analysis_in_progress,
# in_development, urgent_priority) — NON lo ricostruisce da idea.status.
# Può restare vuoto se lo snapshot di questa settimana non ne ha bisogno.
iteration_goal: ""
initiatives:
  - idea_id: ""
    prd_id: null
    jira_card_id: null
    status: ""                      # libero, riflette lo stato reale (es. "in sviluppo", "bloccato", "shipped 70%")
    completion_pct: null
    iteration_bucket: null          # da quale bucket del Piano di Iterazione proviene questa voce

retro_notes: ""                     # mini-retrospettiva dell'iterazione precedente (facoltativa)

# capacity_allocation mostra, per la SETTIMANA dello snapshot, quanta
# capacità del team c'è e dove va: roadmap principale (idea /
# strategic_exception / mandate) vs. classification: platform (debito
# tecnico/devops) — playbook, "flusso di protezione del team" — e, per
# competenza, dove il team è saturo. Unità: persona-settimane NELLA
# settimana dello snapshot (una persona a tempo pieno, senza assenze, al
# netto dell'overhead 0.2 = 0.8). Regole di calcolo: playbook, "Capacità
# del team e slot della roadmap".
#   - total_capacity_weeks: OFFERTA calcolata da team.yaml (fte ×
#     ripartizione per competenza × giorni lavorativi / 5 × (1 −
#     overhead_pct), al netto di festività e assenze). Se team.yaml non ha
#     ancora i dati di capacità (basis: declared), si chiede al team tech
#     come prima — mai presunta.
#   - roadmap_weeks / platform_weeks: DOMANDA della settimana, somma dei
#     carichi settimanali (effort_by_competency / estimated_effort_weeks)
#     delle iniziative il cui slot copre questa settimana (slot_plan
#     sotto). NON la entanglement_score del RICE — è un footprint 1-10.
# Le iniziative in iterazione ancora senza stima vanno in
# undimensioned_ideas, non stimate d'ufficio. La serie storica di questo
# blocco, snapshot dopo snapshot, mostra se il debito tecnico si accumula
# perché non gli si dà spazio, se una competenza è cronicamente il collo
# di bottiglia, e se l'overhead dichiarato è realistico.
capacity_allocation:
  basis: computed                    # computed (da team.yaml) | declared (team.yaml senza capacità: total chiesto al team tech)
  total_capacity_weeks: null         # offerta della settimana, persona-settimane
  platform_weeks: null               # domanda platform della settimana
  platform_pct: null                 # calcolato: platform_weeks / total_capacity_weeks
  roadmap_weeks: null                # domanda roadmap (idea / strategic_exception / mandate) della settimana
  by_competency: []
  #   - competency: backend          # id del catalogo di team.yaml
  #     supply: 2.4                  # persona-settimane disponibili
  #     demand: 2.8                  # persona-settimane impegnate dagli slot attivi
  #     saturation_pct: 117
  #     status: over                 # ok (< 85%) | tight (85–100%) | over (> 100%)
  #     could_cover: []              # members con questa competenza in can_also — proposta, non riassegnazione
  over_capacity_ref: null            # se qualche competenza è over: path del Piano di Iterazione con la decisione registrata (capacity_check.over_capacity_decision)
  undimensioned_ideas: []            # idea_id delle iniziative in iterazione senza effort_by_competency / estimated_effort_weeks
  unsized_members: []                # name dei membri di team.yaml senza capacity.fte — esclusi dall'offerta, da completare con team-roster
  note: ""                           # contesto libero, es. "settimana pesante per un incidente in produzione"

# slot_plan colloca le iniziative dimensionate nelle prossime
# horizon_weeks settimane, in ordine di priorità, dentro la capacità
# residua per competenza (e per squad, se l'istanza ne ha). È la base
# delle viste di medio periodo (roadmap trimestrale, Now/Next/Later): le
# date di inizio/fine NON sono stimate a mano, le ricava lo slotting.
# Advisory come tutto lo snapshot: passa da pending/ con lui, e un
# riordino delle priorità si fa nel Backlog Refinement, non qui.
#
# Ordine di priorità (playbook, "Capacità del team e slot della roadmap"):
#   1. in sviluppo (committed: tengono lo slot già iniziato)
#   2. urgent_priority del piano + mandate / deadline da collocare entro
#      la scadenza
#   3. platform in lavorazione o pianificata dal team
#   4. analisi in corso / da avviare del piano, per RICE
#   5. resto del backlog con stima, per RICE
# Un'iniziativa prende il primo inizio possibile (non prima di
# team.yaml capacity.analysis_lead_weeks se non è ancora in analisi) in
# cui il suo carico settimanale sta nella capacità residua di ogni
# competenza per tutta la durata. Se lo slot si sposta in avanti per
# mancanza di capacità, delayed_by dice quale competenza l'ha fatta
# slittare.
slot_plan:
  horizon_weeks: 13                  # default un trimestre
  from_week: ""                      # settimana ISO dello snapshot
  to_week: ""
  team_updated_at: ""                # team.yaml updated_at usato per il calcolo — rende il calcolo riproducibile
  slots:
  #   - idea_ref: "PG-042"
  #     idea_id: ""
  #     summary: ""
  #     classification: idea         # idea | strategic_exception | mandate | platform
  #     priority_basis: ""           # perché in questa posizione: "in sviluppo" | "mandate, scade 2026-12-31" | "RICE 4.2"
  #     squad: null
  #     start_week: "2026-W44"
  #     end_week: "2026-W48"
  #     estimate_basis: committed    # rough | committed — le viste marcano "stima grezza" le rough
  #     load_by_competency: {}       # carico settimanale, persona-settimane per settimana
  #     status: planned              # committed (in sviluppo) | planned | over_capacity (committed oltre capacità, decisione registrata)
  #     delayed_by: null             # competenza che ne ha fatto slittare l'inizio, o null
  #     due_date: null               # mandate.due_date o deadline.due_date, se c'è
  #     at_risk: false               # true se end_week cade dopo due_date
  unslotted: []
  #   - { idea_ref: "", reason: undimensioned }        # undimensioned | beyond_horizon | infeasible | unknown_competency
  #     # infeasible: il carico settimanale su una competenza supera l'offerta TOTALE (durata troppo corta per il team, o competenza assente)
  saturation_by_month: []
  #   - { month: "2026-11", competency: backend, supply: 9.6, demand: 8.8, saturation_pct: 92 }

# mandates_status elenca TUTTE le idee classification: mandate ancora
# aperte (status diverso da done/aborted) — non solo quelle già in
# initiatives sopra. È il punto in cui un'iniziativa mandataria diventa
# visibile in un MBR/MTR anche PRIMA di essere entrata in lavorazione:
# se aspettassimo che sia in initiatives per vederla, il rischio di
# scoprire la scadenza troppo tardi resterebbe intatto. Popolato da
# roadmap-snapshot leggendo escalation_status calcolato da mandate-watch
# su ciascuna idea (non ricalcolato qui).
mandates_status:
  - idea_id: ""
    mandated_by: ""
    due_date: null
    analysis_start_by: null
    escalation_status: ""             # pending_review | on_track | due_soon | overdue
    current_status: ""                 # status corrente dell'idea (bucket, in_analysis, ecc.)

# deadline_alerts è il fratello di mandates_status per il caso più comune
# e più facile da perdere: idee classification: idea o strategic_exception
# (mai mandate, che ha già mandates_status sopra) con un blocco `deadline`
# valorizzato — una scadenza reale che NON basta da sola a giustificare il
# bypass del RICE, ma che va sorvegliata mentre si avvicina. Elenca TUTTE
# quelle con escalation_status due_soon o overdue, non solo quelle già in
# initiatives — stesso motivo di mandates_status: è prima di entrare in
# lavorazione che rischiano di passare inosservate. Popolato leggendo
# escalation_status calcolato da deadline-watch (non ricalcolato qui).
deadline_alerts:
  - idea_id: ""
    classification: ""                 # idea | strategic_exception
    due_date: null
    escalation_status: ""              # on_track | due_soon | overdue
    rice_rank_note: null                # opzionale: posizione approssimativa in backlog, se classification: idea
    current_status: ""                   # status corrente dell'idea

# unscored_ideas elenca le idee classification: idea ancora con
# rice_history vuoto — stesso principio di mandates_status: renderle
# visibili anche se non sono ancora in initiatives, perché è esattamente
# lì che si perdono (nessuno le nota finché non è troppo tardi). Popolato
# leggendo rice_status calcolato da rice-watch su ciascuna idea (non
# ricalcolato qui).
unscored_ideas:
  - idea_id: ""
    title: ""
    summary: ""                          # da idea.summary — cosa c'è da fare, in chiaro
    days_unscored: null                # calcolato al momento dello snapshot, non un campo persistito sull'idea
    status: ""                          # fresh | aging | stale | blocked_on:{waiting_on} | needs_deep_dive:{richiedente}
    blocked_reason: null
    waiting_on: null
    deep_dive_pending_since: null        # se status needs_deep_dive: da quando il meeting è riconosciuto necessario e non ancora avvenuto

# measurements_status elenca le KPI delle iniziative già rilasciate
# (idea status: done) che meritano attenzione — non solo check_due/
# at_risk/invalidated, ma la serie storica di questa sezione nel tempo
# (uno snapshot per settimana) È il tracciamento delle metriche su Git
# richiesto per prendere decisioni informate su dove veicolare gli
# investimenti futuri: non serve aspettare un livello derivato/DB per
# iniziare ad accumularlo. Popolato leggendo measurement_status
# calcolato da measurement-watch su ciascun product/prds/*/measurement.yaml
# (non ricalcolato qui). Le iniziative con closure.closed: true non
# compaiono più qui — incluso il caso "senza KPI" (kpis vuoto) una volta
# accettata la chiusura: finché non è chiusa, compare comunque una riga
# con kpi_name: null per segnalare che manca ancora l'atto di
# accettazione, anche se non c'è nulla da misurare.
measurements_status:
  - idea_id: ""
    prd_ref: ""
    kpi_name: null                       # null se l'iniziativa non ha KPI di business (vedi not_applicable_reason su measurement.yaml)
    weeks_since_done: null
    measurement_status: ""              # check_due | on_track | achieved | at_risk | invalidated | inconclusive | pending_closure (kpis vuoto, non ancora chiusa)
    latest_reading: null
    target: null
