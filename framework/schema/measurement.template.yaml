# Template per product/prds/{slug}/measurement.yaml (o measurement-1.yaml,
# measurement-2.yaml se il PRD è spaccato in più documenti — un file di
# misurazione per ciascun prd-N-*.md, stessa numerazione).
#
# Scaffoldato da prd-draft al momento della stesura del PRD, a partire
# dalla sezione "## Metriche" (nome delle KPI, baseline, target) — non
# duplica quella sezione, la rende strutturata perché measurement-watch
# possa leggerla senza fare parsing di Markdown libero.
#
# readings è APPEND-ONLY per ciascuna KPI, come rice_history — ogni
# lettura successiva si aggiunge, non sovrascrive le precedenti: serve a
# vedere il trend, non solo l'ultimo valore.
#
# measurement_status e follow_up_needed sono CALCOLATI da measurement-watch
# (fatti/valutazioni osservate, non decisioni di priorità) — scrittura
# diretta, non passano da product/approvals/pending/. L'eccezione è lo
# stato "concluded": lo scrive measurement-watch solo dopo una decisione
# esplicita del PM in conversazione ("non vale più la pena tracciarla"),
# non lo sceglie da sola.

prd_ref: "prd.md"                 # nome del file PRD in questa stessa cartella a cui questa misurazione si riferisce
idea_id: ""                        # link all'idea di origine — measurement-watch legge lì done_at per calcolare le settimane trascorse

measurement_window_weeks: 6        # quante settimane dopo done_at ci si aspetta di iniziare a vedere impatti — regolabile per iniziativa

kpis:
  - name: ""                       # deve corrispondere a una metrica dichiarata nel PRD, sezione Metriche — non ridefinire qui, solo il nome
    baseline: null
    target: null
    unit: ""                        # es. "%", "giorni", "€"
    readings: []
    # Esempio di singola lettura (append-only):
    # - date: "2026-03-01"
    #   value: null
    #   source: ""                   # es. "DataBricks", "report manuale"
    #   note: ""                      # opzionale: contesto della lettura
    measurement_status: pending
    # pending           -> non è ancora passato measurement_window_weeks da done_at, troppo presto per giudicare
    # check_due         -> la finestra è passata ma non c'è ancora nessuna lettura — è il caso "dovremmo star vedendo impatti, controlliamo"
    # on_track          -> readings mostrano un trend verso il target, non ancora raggiunto
    # achieved          -> il target è stato raggiunto (o superato, nella direzione attesa)
    # at_risk           -> la finestra è passata, i dati non mostrano un movimento significativo verso il target
    # invalidated       -> i dati mostrano che l'ipotesi era sbagliata (movimento nella direzione opposta, o nessun effetto plausibile)
    # inconclusive      -> dato non disponibile o troppo rumoroso per giudicare
    # concluded         -> il PM ha deciso esplicitamente di chiudere il tracciamento (raggiunta o no) — stato terminale, esclusa dai futuri alert
    follow_up_needed: false          # segnalato da measurement-watch quando emerge un'ipotesi di iterazione — mai un'idea creata automaticamente, solo un suggerimento
