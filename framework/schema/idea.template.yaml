# Template per product/ideas/{YYYY-MM-DD}-{slug}/idea.yaml
#
# Un'idea nasce da materiale grezzo (email, trascrizione, segnalazione) e
# viene classificata secondo il playbook (sezione "Alimentazione del bucket
# delle idee"): idea normale, bug (bypassa il RICE; il ticket sul tracker
# di esecuzione si apre SUBITO alla conferma di classificazione, non dopo
# un secondo assenso — il blocco `jira` sotto si popola all'intake), Strategic
# Exception (bypassa il RICE, richiede approvazione CEO/CPO-CTO),
# Iniziativa Mandataria/mandate (bypassa SOLO il RICE — non l'analisi —
# perché imposta dall'alto, marcata "critical" da leadership, o vincolata
# a una scadenza esterna fissa; vedi playbook, sezione "Iniziative
# Mandatarie", e il blocco `mandate` più sotto), o platform (debito
# tecnico/devops puro — bypassa il RICE perché la priorità è giudizio del
# team tech dentro una capacità protetta, non valore di business né
# autorità esterna; vedi il blocco `platform` più sotto).
#
# rice_history è APPEND-ONLY per i giudizi: ogni revisione del RICE (nuova
# evidenza, discussione) aggiunge una voce nuova, non sovrascrive le
# precedenti — serve a rispondere a "perché questa idea è cambiata di
# priorità?" in un MBR/MTR senza dover ricostruire la storia a memoria.
# (Una migrazione di formato una-tantum — es. Reach %→1-10 — è l'unica
# eccezione: riscrive un campo derivato, non un giudizio.)

id: "2026-01-08-slug-descrittivo"   # coincide col nome della cartella — identificatore canonico, non cambia mai
short_ref: null
# Handle corto per la conversazione e i cross-reference (Jira, altri PRD):
# "PG-042" è più maneggevole di "2026-01-08-ricevute-non-riconosciute-in-app"
# in riunione. NON sostituisce `id` né il nome cartella (che restano
# l'identificatore canonico e parlante — vedi CLAUDE.md, "Convenzioni di
# naming"): è un campo in più.
#
# Assegnato PIGRAMENTE dalla skill `backlog-refinement` al primo Backlog
# Refinement che incontra l'idea senza `short_ref` — il refinement
# settimanale è un punto di serializzazione a scrittore singolo (un
# facilitatore, `pull` -> assegna -> `push`), quindi niente collisioni
# anche con più PM che lavorano offline. `next = max(numeri short_ref
# esistenti) + 1`, zero-padded a 3 cifre; nessun file contatore da mettere
# in conflitto. Un'idea creata tra due refinement semplicemente non ce
# l'ha ancora — e non le serve finché il team non la discute.
# Una volta assegnato NON cambia più (come lo slug). Prefisso: `PG` di
# default (Product Governance), override per-istanza con la chiave
# `short_ref_prefix` in `.governance/config.yaml`. Il prefisso è un
# namespace di GOVERNANCE, deliberatamente distinto da `jira.project_key`:
# `PG-042` (idea) e `EPITA-121` (card del tracker) non devono confondersi
# — `backlog-refinement` si ferma se i due coincidono. Fatto di
# housekeeping, scrittura diretta, non passa da
# `product/approvals/pending/` (stessa logica di `rice_status`).
title: ""                            # per convenzione: oggetto della mail/segnalazione originale
summary: ""                          # UNA riga in linguaggio piano: cosa c'è da fare, comprensibile senza aprire source/. Il title è spesso solo l'oggetto di una mail — questo è la versione leggibile, mostrata nella lista ordinata del backlog (skill backlog-list). Scritto all'intake.
proposer: ""                         # [NOME] di chi ha proposto l'idea

# Note libere utili a decidere se/quando prioritizzare, oltre a quanto già
# strutturato in rice_status/deadline (es. "lo stakeholder ci tiene molto",
# "dipende dall'iniziativa X", "quick win a basso footprint", "proponente
# junior, mandato poco chiaro"). Mostrate nella lista ordinata del backlog.
# Scrittura diretta, non passa da approvazione.
notes: ""

# Referente tecnico: lo sviluppatore con cui il PM valida l'How e — di
# norma — la prima scelta naturale quando l'iniziativa viene assegnata.
# NON è l'assegnazione formale di implementazione: quella si decide in
# Iteration Planning e vive nel tracker di esecuzione. Si può cambiare
# liberamente, non è un impegno. Vedi playbook, "Team di sviluppo,
# referente tecnico e staffing di un PRD (team-fit)".
#
# All'intake è un'IPOTESI preliminare — idea-intake/inbox-triage lo
# propongono solo se il materiale ha segnale tecnico E c'è
# product/reference/team.yaml popolato, sempre confermato dal PM, mai
# presunto (stessa disciplina di deadline). Diventa solido con il PRD:
# prd-draft esegue il matching di team-fit contro l'How reale e
# denormalizza qui il valore. La fonte di verità per-PRD è il campo
# tech_reference nel frontmatter del PRD; questo è il puntatore per le
# viste e le cerimonie (stesso principio di iteration.current / jira.status).
# Per un'iniziativa spaccata in più PRD è il referente del PRD primario.
#
# Scrittura diretta, mai da product/approvals/pending/ (non è una
# decisione di priorità). Deve corrispondere a un members[].name di
# product/reference/team.yaml.
tech_reference: null

source:
  type: email                        # email | meeting_transcript | slack | jira_backfill | other
  ref: ""                            # citazione/pointer al materiale in source/ (es. "source/email-2026-01-08.eml"); per jira_backfill: la chiave della card (es. "EPITA-317")
  # jira_backfill: l'idea è stata creata da delivery-watch quando ha
  # intercettato attività su una card del tracker non collegata a nessuna
  # idea (lavoro andato dritto su Jira, fuori governance). Vedi
  # backfill_review_needed più sotto e la skill delivery-watch.

product_line: ""                     # deve corrispondere a un name in product/reference/product-lines.yaml — può restare "" se status è needs_clarification, o restare vuoto per classification: platform se non è legata a una Product Line specifica
classification: idea                 # idea | bug | strategic_exception | mandate | platform — può restare provvisoria se status è needs_clarification

status: bucket
# needs_clarification -> bucket -> prioritized -> in_backlog_refinement -> in_analysis -> in_prd -> in_roadmap -> in_jira -> done | aborted | declined
#
# declined è uno stato TERMINALE distinto da aborted: l'elemento è stato
# scartato AL TRIAGE perché non è qualcosa su cui il team può/deve
# lavorare (non un problema di prodotto, fuori perimetro, richiesta di
# supporto, ecc.) — non è mai entrato nel processo. aborted invece è
# un'iniziativa che ERA stata accolta (spesso GO) e poi è stata
# interrotta. Distinguerli ha valore di audit: "quante richieste
# scartiamo al triage" vs "quante iniziative interrompiamo dopo averle
# avviate". Vedi playbook, "Chiudere il loop col richiedente".
# Il record si crea comunque (archivio), con decline_reason compilato e
# requester_reply.draft pronta — inbox-triage/idea-intake propongono
# declined e chiedono conferma al PM prima di scriverlo, non decidono da
# soli.
#
# classification: bug e strategic_exception saltano quasi tutta la catena:
# tipicamente bucket -> in_jira -> done direttamente (bug) o, per strategic
# exception, bucket -> in_jira -> done non appena approvata — non passano
# né da prioritized (niente RICE) né dal Backlog Refinement per priorità.
#
# classification: mandate salta SOLO prioritized (niente RICE): segue lo
# stesso percorso di un'idea normale per il resto — bucket ->
# in_backlog_refinement -> in_analysis -> in_prd -> in_roadmap -> in_jira
# -> done. L'ingresso in analisi è forzato dalla scadenza (vedi blocco
# `mandate` e skill mandate-watch), non dal ranking RICE.
#
# classification: platform salta SOLO prioritized, come mandate — segue
# lo stesso percorso per il resto, inclusa l'eventuale Complete Analysis/
# PRD per le iniziative di dimensione importante (le più piccole possono
# saltare direttamente a in_jira, a giudizio del team tech). Entra
# comunque in product/roadmap/snapshots/ come qualunque altra iniziativa
# quando entra in iterazione — non è lavoro invisibile, solo non
# RICE-ranked.

done_at: null
# Data in cui status è passato a "done" (Definition of Done: codice in
# produzione — playbook, "Product Design, development and rollout"). Un
# fatto, non una decisione: chi/cosa porta l'idea a status: done scrive
# anche questa data, scrittura diretta senza approvazione. Se status è
# già "done" ma questo campo è ancora null (idea più vecchia di
# quest'aggiunta allo schema), va chiesto al PM, mai presunto "oggi" —
# serve a measurement-watch per calcolare da quanto tempo un'iniziativa
# è in produzione.

decline_reason: null
# Solo se status: declined. Perché è stata scartata al triage, in una
# riga (es. "richiesta di supporto tecnico, non un tema di prodotto",
# "fuori dal perimetro del team", "già coperto da X"). Compilato da
# inbox-triage/idea-intake su conferma del PM. La bozza di risposta al
# richiedente sta in requester_reply.draft.

created_at: "2026-01-08"
# Per l'intake storico di un backlog pre-esistente (playbook, "Intake
# storico e roadmap pre-esistente"): usa la data di CREAZIONE ORIGINALE
# dell'elemento nello strumento di provenienza, non la data dell'intake —
# rice-watch/mandate-watch/measurement-watch contano il tempo trascorso
# da qui.

backfill_review_needed: false
# true SOLO sulle idee create da delivery-watch per backfill (source.type:
# jira_backfill): l'idea è nata da una card Jira intercettata fuori
# governance, con classificazione/product_line/summary ABBOZZATI dalla
# card, non confermati dal PM. delivery-watch (modalità triage) e
# backlog-refinement la segnalano finché il PM non rivede quei campi (o
# archivia l'idea come declined/aborted se è lavoro spurio) e azzera il
# flag. Fatto di provenienza, scrittura diretta, non passa da
# product/approvals/pending/ (stessa logica di rice_status).

# --- Solo se status: needs_clarification (materiale arrivato in product/inbox/
# troppo ambiguo per essere classificato senza altre informazioni) ---
clarification:
  needed: false                # true se status è needs_clarification
  questions: []                 # domande da porre a chi ha mandato il materiale originale
  draft_message: null           # bozza di messaggio di richiesta chiarimento, pronta per l'invio (mai inviata in automatico)
  sent_at: null
  resolved_at: null             # quando arriva la risposta e l'idea può essere riclassificata

# --- Bozza di risposta al richiedente (chiudere il loop) ---
#
# Nessun richiedente resta appeso: OGNI intake con un richiedente che non
# è il PM stesso produce una bozza di risposta, qualunque sia l'esito del
# triage (idea, bug, strategic exception, mandate, platform, scarto,
# chiarimento) — mai inviata in automatico, il PM la rivede e la manda
# lui. Vedi playbook, "Chiudere il loop col richiedente". Scrittura diretta
# sull'idea (come clarification.draft_message), NON passa da
# product/approvals/pending/: è una cortesia 1:1 con l'idea, non una
# decisione applicata a un target file.
#
# needed: false SOLO quando non c'è nessuno da avvisare: l'idea nasce dal
# PM stesso, da un brainstorm interno, o da un backfill di delivery-watch.
# Un canale non noto NON è un motivo per saltare: la bozza si scrive
# comunque e il recap segnala che il canale va trovato. Materiale
# inoltrato dal PM per conto di uno stakeholder: il richiedente è lo
# stakeholder, needed: true.
#
# reply_status (è la chiave che l'hook check-requester-replies.sh conta):
#   - not_needed   -> needed: false
#   - drafted      -> bozza pronta, non ancora inviata
#   - consolidated -> lo stesso mittente ha generato più unità: la bozza è
#     UNA sola (copre tutti gli esiti) e vive nell'unità indicata da
#     consolidated_in — qui draft resta null
#   - sent         -> il PM dichiara di averla inviata (sent_at)
#   - waived       -> il PM decide che non serve (es. ha già risposto a
#     voce) — waived_reason dato da lui, mai presunto
#
# kind:
#   - acknowledgement       -> idea normale: presa in carico + (se serve)
#     un meeting di approfondimento + prima ipotesi onesta di timing
#   - clarification_request -> status needs_clarification: la bozza pone
#     le domande (coincide con clarification.draft_message — non
#     duplicare, valorizza kind qui e il testo lì)
#   - decline              -> status declined: spiega perché il team non
#     può aiutare su questo, con tono rispettoso
#   - strategic_exception_ack -> classification strategic_exception
#     invocata all'intake: accolta su canale privilegiato, IN ATTESA DI
#     CONFERMA dall'autorità richiesta (CEO/CPO-CTO) — non dire "approvata"
#     finché non lo è — + impegno a restituire feedback sull'esito
#     (playbook, "Alimentazione del bucket delle idee", punto b)
#   - bug_ack              -> classification bug: confermato come bug, entra
#     nell'agenda del team di sviluppo senza passare dalla prioritizzazione;
#     riferimento al ticket (o "in apertura" se il connettore era giù) e
#     impatto stimato; mai una data di risoluzione; verrà avvisato alla
#     chiusura (conclusion_notices)
#   - mandate_ack          -> classification mandate: presa in carico come
#     iniziativa mandataria (salta la prioritizzazione, non l'analisi);
#     scadenza registrata e monitorata; quando partirà l'analisi come
#     forbice, mai una promessa
#   - platform_ack         -> classification platform proposta da qualcuno
#     che non è il PM: presa in carico, rientra nella capacità protetta per
#     il debito tecnico, se ne parla in Iteration Planning
#
# deep_dive_meeting_needed: true se per fare un RICE serio serve una
# riunione col richiedente (dato mancante che solo lui ha, problema da
# inquadrare meglio). Se true, rice_status.deep_dive più sotto va
# compilato di conseguenza — è ciò che rice-watch usa per ricordartelo
# finché il meeting non avviene.
requester_reply:
  needed: false
  reply_status: not_needed      # not_needed | drafted | consolidated | sent | waived
  kind: null                    # acknowledgement | clarification_request | decline | strategic_exception_ack | bug_ack | mandate_ack | platform_ack
  recipients: []                # il proponente + chi nel materiale ha posto una domanda diretta (thread a più voci) — confermati dal PM
  draft: null                   # testo pronto per l'invio manuale — mai inviato in automatico. Testo semplice, blocco letterale |:
                                #   un paragrafo per riga, niente Markdown/simboli/firma (playbook, "Testi che il PM manda a mano")
  consolidated_in: null         # solo se reply_status: consolidated — slug dell'unità che contiene la bozza unica
  deep_dive_meeting_needed: false
  sent_at: null                 # data dichiarata dal PM dopo l'invio manuale
  waived_reason: null           # solo se waived — dato dal PM

# --- Risposte a materiale arrivato DOPO l'intake (aggiornamenti) ---
#
# Chi manda materiale nuovo su un'idea o su un PRD già esistente (un dato,
# un'obiezione, una precisazione, un sollecito) è un richiedente come gli
# altri: inbox-triage prepara una bozza anche per lui. Il materiale va in
# source/ dell'idea o del PRD; la bozza vive QUI, sull'idea (per un PRD:
# sull'idea indicata dal suo idea_id). APPEND-ONLY: una voce per
# materiale ricevuto, mai cancellata. Stessi reply_status/consolidated_in/
# sent_at/waived_reason di requester_reply, stesso hook.
#
# kind: update_ack — ricevuto, collegato a {short_ref/titolo}; dov'è oggi
# l'iniziativa in linguaggio piano (backlog, analisi, sviluppo…); cosa
# succede al materiale (se può cambiare la stima: "verrà valutato" — mai
# anticipare l'esito di un rice-update; se tocca un PRD: "confluirà nella
# prossima revisione"). Nessuna data, nessuna promessa.
followup_replies: []
# Esempio di singola voce:
# - received_at: ""             # ISO
#   from: ""                    # chi ha mandato il materiale
#   about: idea                 # idea | prd:<slug>
#   source_file: ""             # percorso del materiale in source/ (dell'idea o del PRD)
#   kind: update_ack
#   reply_status: drafted       # not_needed | drafted | consolidated | sent | waived
#   recipients: []
#   draft: null
#   consolidated_in: null       # slug dell'idea che contiene la bozza unica (stesso mittente, più unità)
#   sent_at: null
#   waived_reason: null

# --- Avviso di conclusione agli stakeholder (chiudere il loop alla fine) ---
#
# requester_reply chiude il loop all'INGRESSO; conclusion_notices lo chiude
# all'USCITA. Ogni conclusione di un'iniziativa genera un avviso
# OBBLIGATORIO agli stakeholder — vedi playbook, "Avvisare gli stakeholder
# della conclusione". Tre conclusioni:
#   - delivered          -> status passa a done (codice in produzione; per
#     un bug: il problema segnalato è chiuso)
#   - measurement_closed -> closure.closed passa a true nel
#     measurement*.yaml del PRD (esito: si è mossa / non si è mossa)
#   - aborted            -> status passa ad aborted (iniziativa avviata e
#     poi interrotta: perché, e cosa succede alla richiesta)
#
# GATE: status: done, status: aborted e closure.closed: true si scrivono
# SOLO nello stesso passo in cui la voce corrispondente arriva a
# notice_status: sent (il PM dichiara di averla inviata) o waived (esente,
# con waived_reason dato dal PM — mai presunto, mai automatico). Finché la
# voce è pending/drafted, l'idea resta nello stato precedente: la
# conclusione è RILEVATA, non ancora AVVENUTA per il metodo. done_at
# resta la data del fatto (rilascio in produzione), non quella dell'invio.
#
# Mai inviato in automatico: la bozza la scrive la skill, il PM la manda a
# mano (stessa logica di requester_reply). Scrittura diretta sull'idea, NON
# passa da product/approvals/pending/: è comunicazione 1:1 con
# l'iniziativa, non una decisione di priorità. APPEND-ONLY: una voce per
# conclusione, mai cancellata (audit — "chi abbiamo avvisato, quando, con
# che testo"). L'hook check-conclusion-notices.sh conta le voci
# pending/drafted a inizio e fine sessione.
conclusion_notices: []
# Esempio di singola voce:
# - kind: delivered             # delivered | measurement_closed | aborted
#   detected_at: ""             # ISO — quando la conclusione è stata rilevata/proposta
#   detected_by: ""             # delivery-watch | jira-sync | measurement-watch | backlog-refinement | pm
#   source_ref: null            # es. id della voce di coda di delivery-watch, o percorso del measurement*.yaml
#   notice_status: pending      # pending | drafted | sent | waived
#   recipients: []              # proposer (se esterno) + stakeholders della product_line (product-lines.yaml) — confermati dal PM
#   subject: null
#   body: null                  # testo pronto da copiare — mai inviato in automatico. Testo semplice, blocco letterale |
#                               #   (playbook, "Testi che il PM manda a mano: visibili e pronti da copiare")
#   sent_at: null               # data dichiarata dal PM dopo l'invio manuale
#   waived_reason: null         # solo se waived: perché non c'è nessuno da avvisare (es. "idea interna del PM, product line senza stakeholder esterni") — dato dal PM

# --- Solo per classification: idea (bug e strategic_exception saltano il RICE) ---
#
# La "E" del RICE è ENTANGLEMENT (footprint del cambiamento), NON Effort
# inteso come settimane-sviluppatore. Vedi playbook, "Ideas
# prioritization": con l'implementazione AI-assistita il tempo di codifica
# si è scollegato dal costo reale di un cambiamento; quello che resta e
# domina è quanto l'iniziativa è intrecciata col sistema (quanti
# componenti/sistemi/team tocca, superficie di regressione, complessità di
# review e rollout). Scala 1-10, valore alto = più intrecciata = più a
# rischio = deprioritizzata (è a denominatore).
# La stima di tempo-calendario per la pianificazione NON vive qui: vedi
# il blocco `delivery` più sotto (contabilità di capacità d'iterazione) e
# `mandate.lead_time_weeks` (runway prima di una scadenza).
# rice_history è APPEND-ONLY per i GIUDIZI: ogni revisione delle stime
# aggiunge una voce, non modifica le precedenti. Fa eccezione una
# migrazione di FORMATO una-tantum (es. il riscalamento di Reach da
# percentuale 0-100 a banda intera 1-10): riscrive il campo derivato
# delle voci esistenti senza toccare i giudizi — vedi
# `sync-framework-updates`, che la applica in modo meccanico.
rice_history: []
# Esempio di singola voce (aggiungerne una nuova ad ogni revisione, mai modificare le precedenti):
# - date: "2026-01-08"
#   reach_points: 2            # 1-10 = max(1, ceil(percentuale sulla popolazione della product_line / 10)) — MAI valore assoluto. La percentuale è solo il MODO di ricavarlo, non un campo dello score.
#   reach_absolute_note: ""    # dove si annota la % sottostante e/o l'assoluto (rende auditabile la banda): es. "≈15% della popolazione (30% ric. non riconosciute × 50%) → 2"
#   impact_points: 5           # scala 1-10, EBITDA incrementale atteso vs. target annuale della product line
#   confidence_score: 10       # 1-10
#   confidence_evidence_tier: quantitative_multi_source
#   # opinion (1-3) | anecdotal (3-6) | quantitative_single_source (6-8) | quantitative_multi_source (>8)
#   entanglement_score: 4      # 1-10, footprint del cambiamento nel sistema (blast radius) — MAI settimane
#   entanglement_basis: code_inspection
#   # code_inspection (rice-update ha ispezionato apps/) | structured_estimate (stima con referente tecnico, apps/ non disponibile o sistema non montato — evidenza più debole)
#   entanglement_note: ""      # cosa tocca: sistemi, componenti, interfacce/consumer, + eventuali costi esterni hard (legale, licenze, UAT estesa)
#   score: null                 # calcolato: reach_points * impact_points * confidence_score / entanglement_score
#   reach_percent: null         # DEPRECATO come campo di scoring — presente solo nelle voci precedenti al riscalamento 1-10. Non compilarlo per voci nuove (la % va in reach_absolute_note).
#   rationale: ""               # perché questi valori — riferimento alla discussione/evidenza
#   approved_by: ""             # referente tecnico e/o stakeholder che ha validato la stima
#   ceremony_ref: null          # opzionale: link a product/ceremonies/... se la revisione è nata lì
#   effort_weeks: null          # DEPRECATO — vecchia semantica "settimane-sviluppatore". Presente solo nelle voci storiche precedenti a questo schema; non compilarlo per voci nuove.

# rice_status esiste per rispondere a una domanda diversa da rice_history:
# non "qual è il RICE", ma "perché questa idea non ce l'ha ancora". Un'idea
# classification: idea che resta con rice_history vuoto per settimane
# rischia di essere dimenticata nel bucket — spesso perché manca
# un'informazione da uno stakeholder per calibrare Reach/Impact
# correttamente, non per semplice disattenzione. Calcolato/aggiornato dalla
# skill rice-watch: flagged_since è un fatto (prima volta rilevata come non
# quotata), blocked_reason/waiting_on sono annotati SOLO se noti — mai
# presunti, chiesti esplicitamente al PM quando rice-watch la rileva.
# Non passa da product/approvals/pending/: è cattura di contesto, non una
# decisione di priorità (stessa logica della creazione dell'idea stessa).
rice_status:
  flagged_since: null           # data della prima volta che rice-watch l'ha rilevata senza RICE — null se ha già uno score o non è mai stata scansionata
  blocked_reason: null           # perché non è ancora stata quotata, se noto (es. "manca stima Impact da Sales")
  waiting_on: null                # chi dovrebbe fornire l'informazione mancante
  # deep_dive: il sotto-caso in cui lo sblocco non è "aspettare un dato"
  # ma "organizzare una riunione col richiedente". rice-watch lo tratta
  # come categoria distinta e continua a ricordarlo finché done_at resta
  # null — ed escala se requested_at è vecchio e il meeting non è ancora
  # avvenuto. Tutti fatti/cattura di contesto, scrittura diretta.
  deep_dive:
    needed: false               # true se serve un meeting di approfondimento col richiedente per fare un RICE serio
    requested_at: null          # quando è stato segnalato che serve (di solito = data dell'intake)
    scheduled_for: null         # data del meeting, quando fissato
    done_at: null               # quando il meeting è avvenuto — da qui rice-watch smette di ricordarlo (l'idea dovrebbe ottenere un RICE a breve)

# strategic_exceptions è APPEND-ONLY, come rice_history — una Strategic
# Exception può essere invocata in DUE momenti distinti della vita di
# un'idea, e vanno tracciati entrambi (playbook, "Come gestire le
# frizioni" — Scenario 2: il PM tiene traccia di ogni Strategic Exception
# per intercettare pattern, es. lo stesso stakeholder che la invoca ogni
# settimana):
#
# 1. invoked_at_stage: intake — l'idea nasce già come Strategic Exception
#    (classification: strategic_exception sopra), proposta su un canale
#    privilegiato, salta il RICE fin dall'inizio. Rientra qui anche
#    l'intake storico di una roadmap decisa da leadership PRIMA del
#    framework (iniziativa già GO): in quel caso approved_by è il PM che
#    conduce l'intake — unico caso in cui non è un livello CEO/CPO-CTO,
#    si assume la responsabilità di portare avanti una decisione presa
#    altrove — e reason è la motivazione originale. Vedi playbook,
#    "Intake storico e roadmap pre-esistente".
# 2. invoked_at_stage: backlog_refinement — l'idea era una classification:
#    idea normale, CON un suo rice_history reale, ma durante il Backlog
#    Refinement viene fatta entrare nell'iterazione corrente saltando
#    davanti a idee con RICE score più alto ancora in backlog. Questo È
#    un'interruzione dell'agenda via Strategic Exception (playbook,
#    "Ideas prioritization": "per interrompere l'agenda di sviluppo con
#    una nuova attività immediata si deve ricorrere sempre alla Strategic
#    Exception") — anche se l'idea aveva già un RICE regolare.
#    La skill backlog-refinement la rileva confrontando la posizione assegnata
#    col RICE score, e chiede esplicitamente se è un'eccezione (bypass su
#    autorizzazione di uno stakeholder) o una scelta qualitativa del team
#    dentro il processo normale (in tal caso NON va qui, resta solo nel
#    campo `reprioritizations` della cerimonia — vedi
#    ceremony-decisions.template.yaml).
#
# La classification dell'idea NON cambia per un'eccezione invocata in
# fase 2: l'idea resta "classification: idea", ha comunque un RICE reale,
# semplicemente questa specifica iterazione l'ha fatta passare avanti.
strategic_exceptions: []
# Esempio di singola voce:
# - date: "2026-01-08"
#   invoked_at_stage: backlog_refinement   # intake | backlog_refinement
#   approved_by: "CPO/CTO"                  # chi ha autorizzato il bypass — mai presunto, va confermato esplicitamente
#   reason: ""                              # perché è stata accolta comunque
#   ceremony_ref: "product/ceremonies/backlog-refinement/2026-W02"  # null se invocata all'intake

# --- Scadenza esterna, per QUALUNQUE classification tranne mandate
# (idea, strategic_exception, platform — mandate ha già il proprio
# mandate.due_date, vedi sotto) ---
#
# Distinzione dal blocco `mandate`: `mandate.due_date` esiste SOLO
# quando l'iniziativa già salta il RICE per definizione (imposta
# dall'alto, "critical", o scadenza esterna rigida — playbook,
# "Iniziative Mandatarie"). Questo blocco copre il caso più comune e più
# insidioso: un'idea NORMALE (con RICE reale) — o una strategic_exception
# già invocata per un'altra ragione — che ha comunque una scadenza vera,
# non abbastanza da giustificare da sola il bypass del RICE, ma
# abbastanza da meritare sorveglianza mentre si avvicina. Impostarlo
# **non salta il RICE e non decide nulla da solo**: è un fatto reso
# visibile — la decisione (Strategic Exception, riclassificare a
# `mandate` se soddisfa davvero quella definizione, o lasciare che il
# RICE segua il suo corso) resta del PM. Vedi playbook, "Ideas
# prioritization" -> "Scadenze su idee normali", e skill `deadline-watch`.
#
# due_date/note vanno sempre chiesti esplicitamente, mai presunti (stesso
# principio garantista di mandated_by/rationale). Scrittura diretta, non
# passa da product/approvals/pending/: impostarlo non cambia la priorità,
# stessa logica di rice_status. escalation_status è invece CALCOLATO
# dalla skill `deadline-watch`, non va mai compilato a mano.
deadline:
  due_date: null                # data precisa, mai "presto"/"appena possibile" — null se non c'è una scadenza reale
  note: null                     # perché c'è questa scadenza (contratto, impegno con un cliente, evento) — mai presunta
  escalation_status: null        # on_track | due_soon | overdue — calcolato da deadline-watch; null finché due_date è null

# --- Solo per classification: mandate ---
#
# A differenza di strategic_exceptions (che tiene uno storico di eventi
# distinti), mandate è un blocco che si AGGIORNA — descrive un'unica
# iniziativa mandataria, non una sequenza di invocazioni. mandated_by e
# rationale non vanno mai presunti (stesso principio garantista di
# idea-intake/inbox-triage): vanno chiesti esplicitamente, indipendentemente
# dal ruolo di chi propone — non c'è un vincolo di ruolo su chi può
# dichiarare un mandate (a differenza delle Strategic Exception, che
# richiedono CEO/CPO-CTO), il controllo di eventuali abusi della categoria
# avviene a posteriori rendendo il pattern visibile in mandates_status
# (roadmap-snapshot), non bloccando a priori.
#
# analysis_start_by e escalation_status sono CALCOLATI dalla skill
# mandate-watch (fatti derivati, non decisioni) — non vanno mai compilati
# a mano. Le modifiche a due_date/lead_time_weeks/mandated_by dopo la
# creazione iniziale passano invece da product/approvals/pending/
# (type: mandate_update) come un diff RICE.
#
# Riclassificazione a mandate di un'idea già esistente (classification:
# idea o strategic_exception, tipicamente segnalata da deadline-watch
# quando il blocco `deadline` sopra si avvicina e soddisfa la
# definizione di mandate): passa da product/approvals/pending/
# (type: mandate_reclassification), MAI applicata direttamente — cambia
# come l'iniziativa compete, va tracciata come le altre decisioni di
# priorità. rice_history esistente NON si cancella: resta append-only,
# come registro storico di cosa sarebbe valso nel processo RICE normale.
mandate:
  mandated_by: null             # persona/organo che impone l'iniziativa — mai presunto
  rationale: null                # perché è mandataria (compliance, direttiva strategica, contratto, evento fisso)
  is_critical: false              # true se leadership la marca "critical" indipendentemente da una data
  due_date: null                   # scadenza fissa esterna, se esiste (null se non c'è)
  lead_time_weeks: null            # runway stimato prima della due_date — andrebbe validato con un referente tecnico
  analysis_start_by: null          # calcolato da mandate-watch: due_date - lead_time_weeks
  escalation_status: pending_review   # pending_review | on_track | due_soon | overdue — calcolato da mandate-watch

# --- Solo per classification: platform ---
#
# Debito tecnico o devops puro (playbook: "flusso di protezione del team
# per manutenzione ordinaria, gestione del debito tecnico, bug, POC").
# Chi la propone varia — a volte il team tech in autonomia, a volte
# mediata dal PM — non c'è un vincolo su questo, ma rationale va sempre
# chiesto esplicitamente, mai presunto. estimated_effort_weeks alimenta
# capacity_allocation in roadmap-snapshot (quota di capacità
# dell'iterazione andata a platform vs. roadmap principale) — va validato
# dal team tech (è una stima di tempo-calendario, non l'Entanglement del
# RICE: quello per le platform non esiste, saltano il RICE).
# effort_by_competency / squad hanno lo stesso significato del blocco
# delivery sotto: la platform consuma la stessa capacità del team e va
# negli stessi slot (playbook, "Capacità del team e slot della roadmap").
platform:
  rationale: null                # perché serve (rischio di rottura, manutenibilità, upgrade necessario, ecc.)
  estimated_effort_weeks: null    # durata stimata in settimane-calendario — usata per la capacità protetta e lo slot, non per un RICE
  effort_by_competency: {}        # persona-settimane per competenza del catalogo di team.yaml — es. { devops: 2, backend: 1 }
  squad: null                     # id di team.yaml squads[] se l'istanza ha squad; null = pool dell'intero team

# --- Per classification: idea / strategic_exception / mandate — stima di
# delivery per la capacità e gli slot della roadmap (capacity_check del
# Piano di Iterazione, capacity_allocation e slot_plan dello snapshot, in
# parallelo al blocco platform). NON è un input del RICE — la E del RICE è
# Entanglement (footprint), non tempo.
#
# Due numeri distinti, entrambi del team tech:
#   - effort_by_competency: QUANTO lavoro, in persona-settimane per
#     competenza del catalogo di team.yaml (la domanda da confrontare con
#     l'offerta). { backend: 3, frontend: 2, qa: 1 } = 6 persona-settimane.
#   - estimated_effort_weeks: in QUANTO TEMPO-CALENDARIO, una volta
#     partita (la durata dello slot). Il carico settimanale su una
#     competenza è effort_by_competency[c] / estimated_effort_weeks: se
#     supera l'offerta di quella competenza l'iniziativa non può stare in
#     quella durata — le skill lo segnalano, non lo correggono da sole.
# La data di inizio e di fine NON si stimano qui: le ricava lo slotting
# della roadmap dalla capacità residua (slot_plan dello snapshot).
#
# Una stima nasce "rough" quando il referente tecnico valida l'How in
# prd-draft (serve a collocare l'iniziativa nel trimestre prima che entri
# in iterazione) e diventa "committed" in Iteration Planning, con la
# valutazione 80/20 in mano. Resta null finché nessuno l'ha data: le viste
# la mostrano come "non dimensionata", non la presumono. Scrittura diretta
# come un fatto di pianificazione, non passa da product/approvals/pending/. ---
delivery:
  estimated_effort_weeks: null    # durata in settimane-calendario stimata dal team tech — solo capacità/slot, non RICE
  effort_by_competency: {}        # persona-settimane per competenza del catalogo di team.yaml — es. { backend: 3, frontend: 2, qa: 1 }
  squad: null                     # id di team.yaml squads[] se l'istanza ha squad; null = pool dell'intero team
  estimate_basis: null            # rough (prd-draft, dal referente tecnico) | committed (Iteration Planning) | null
  estimated_at: null              # data ISO dell'ultima stima

# --- Puntatore denormalizzato al Piano di Iterazione corrente ---
#
# Riflette in quale bucket del Piano di Iterazione APPROVATO più recente
# (product/roadmap/iterations/{settimana}.yaml) l'idea compare. Serve a
# backlog-list / iteration-board per non dover fare parsing di tutti i
# file di iterazione a ogni vista.
#
# Scritto SOLO dalla skill pending-approval, all'approvazione di una
# proposta type: iteration_plan — denormalizzazione di una decisione già
# approvata, scrittura diretta senza passare (di nuovo) da
# product/approvals/pending/ (stesso principio di jira.status). Azzerato
# quando l'idea esce da tutti i bucket di un piano successivo. La fonte di
# verità resta il file di iterazione, non questo campo.
iteration:
  current: null                   # settimana ISO dell'ultimo iteration_plan approvato in cui l'idea compare; null se in nessuno
  bucket: null                    # analysis_todo | analysis_in_progress | in_development | urgent_priority

# --- Popolato al push sul tracker di esecuzione: alla prioritizzazione per
# le idee normali, GIÀ ALL'INTAKE per classification: bug (il ticket di un
# bug confermato si apre subito — vedi playbook, "Alimentazione del bucket
# delle idee", punto a). Fatto osservato, scrittura diretta, mai da pending/ ---
jira:
  card_id: null
  url: null
  last_polled_at: null
  status: null

links:
  prd_ids: []                   # slug dei PRD collegati in product/prds/
  nsm_targeted: []               # opzionale: [{product_line, name}] delle NSM che questa idea mira esplicitamente a recuperare
  # — popolato quando l'idea nasce da un riorientamento di Discovery
  # confermato via nsm-watch (product/reference/nsm-tracking.yaml,
  # alert.discovery_focus_confirmed), per poter verificare più avanti se
  # il focus ha davvero funzionato. Vuoto per la stragrande maggioranza
  # delle idee — non forzarlo.

# --- Path da monitorare (skill path-watch) ---
#
# Solo se l'istanza ha una fonte analytics collegata (metrics.configured:
# true in .governance/config.yaml, metrics.paths.enabled non false). I
# percorsi utente — funnel, sequenze di pagine/schermate/eventi — che
# l'idea dovrebbe muovere (o non deve peggiorare), trovati nel CATALOGO
# REALE dell'analytics e nel codice di apps/, mai inventati. Vedi
# playbook, "Measurement", sottosezione "Path da monitorare".
#
# Suggeriti E APPLICATI da path-watch (all'intake, in prd-draft, a ogni
# sweep del Backlog Refinement, standalone): configurazione di cosa
# osservare, non una decisione di priorità — scrittura diretta, mai da
# product/approvals/pending/, recap al PM. Il PM ne toglie uno con
# status: removed + removed_reason (chiesto, mai presunto): un path
# removed non viene più riproposto.
#
# Applicati anche NELLO STRUMENTO di analytics (metrics.paths.write):
# funnel/report salvato del path (creato, o uno esistente riusato e
# allineato), eventi mancanti come pianificati. Anche su oggetti creati
# da altri, ma solo con modifiche REVERSIBILI e senza toccare i dati
# storici: ogni modifica registra in analytics_changes come tornare
# indietro; ogni azione irreversibile (eliminazioni, merge/blocco/rinomina
# di eventi, dati, impostazioni, o una modifica di cui non si è potuto
# salvare lo stato precedente) chiede conferma esplicita del PM prima.
# Vedi skill path-watch, passo 6.
#
# baseline è sempre un AGGREGATO (numero + unità + finestra), mai righe
# grezze né dati per utente: questo file è tracciato da git.
# Una KPI di measurement*.yaml può puntare a un path con
# data_source.path_ref = id — scelta del PM nel PRD, non di path-watch.
monitoring:
  paths: []
  no_path_reason: null              # perché non c'è un path osservabile, se paths è vuoto dopo un giro (es. "back-office senza telemetria") — mai un path di comodo
  last_checked_at: null             # ultimo giro di path-watch su questa idea
  # Esempio di singolo path:
  # - id: "caricamento-ricevuta"     # slug stabile, unico nell'idea — è ciò che path_ref referenzia
  #   label: ""                       # in linguaggio piano: "dall'apertura della fotocamera alla ricevuta salvata"
  #   kind: funnel                    # funnel | page_path | screen_flow | event
  #   steps: []                       # nomi ESATTI come compaiono nel catalogo analytics, in ordine
  #   analytics_ref: null             # id del funnel/report salvato nel tool per questo path — riusato se esisteva, altrimenti creato da path-watch
  #   analytics_created_by_framework: false  # true se l'oggetto l'ha creato path-watch, false se esisteva (di altri) ed è stato riusato
  #   planned_events: []              # eventi aggiunti come "pianificati" al tracking plan del tool per i missing_steps
  #   analytics_changes: []           # APPEND-ONLY: ogni scrittura fatta nello strumento per questo path, con come annullarla
  #   # - at: "2026-10-18T10:00:00"
  #   #   object_ref: ""              # id dell'oggetto toccato
  #   #   action: ""                  # create | update_definition | add_to_dashboard | move | plan_event | delete | ... (descrittivo)
  #   #   object_owner: framework     # framework | others — chi aveva creato l'oggetto
  #   #   reversible: true
  #   #   before: null                # id di versione del tool, oppure la DEFINIZIONE completa precedente (step, filtri, nome, cartella) — solo configurazione, mai dati. null solo per create
  #   #   confirmed_by: null          # obbligatorio se reversible: false — chi ha detto sì a QUESTA modifica (chiesto, mai presunto)
  #   #   reverted_at: null           # se annullata (es. da rollback-ceremony)
  #   rationale: ""                   # perché questo path c'entra con l'idea: comportamento da muovere, o guardia
  #   evidence: ""                    # dove è stato trovato: voce di catalogo + file/rotta in apps/
  #   status: active                  # active | to_instrument | broken | removed
  #   # active        -> tutti gli step esistono nel catalogo
  #   # to_instrument -> almeno uno step manca: requisito di tracciamento per il PRD, ricontrollato a ogni giro
  #   # broken        -> era active, uno step è sparito dal catalogo (rinominato/rimosso) — da sistemare prima della misurazione
  #   # removed       -> tolto dal PM, non più riproposto
  #   missing_steps: []               # per to_instrument/broken
  #   broken_since: null
  #   baseline: null                  # {value, unit, window_days, read_at} — aggregato, oppure null se il connettore non lo calcola
  #   applied_by: path-watch          # path-watch | pm
  #   applied_at: null
  #   last_checked_at: null
  #   removed_reason: null
