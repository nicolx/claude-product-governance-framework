# Template per .governance/config.yaml — il file che marca un fork come
# istanza operativa del framework (la sua sola presenza attiva hook e
# sincronizzazione; vedi playbook, "Sincronizzazione dell'istanza").
#
# Scritto da `init-governance-project`. In seguito si modifica solo su
# richiesta esplicita dell'utente. Non è tracciato per esclusione — è
# proprietà istanza (vedi CLAUDE.md, confini di proprietà).

project: ""                       # nome leggibile dell'istanza
initialized_at: ""                # data ISO dell'inizializzazione
pm_roster: []                     # [NOME] dei PM che operano su questa istanza

framework:
  upstream_ref: ""                # commit di upstream/main al momento dell'init (o HEAD) — lo usa sync-framework-updates

# --- Sincronizzazione dati con origin (vedi playbook) ---
sync:
  auto_pull: true                 # default true — una chiave a false spegne quel lato
  auto_push: true

# --- Opzionali ---
# dry_run: true                   # istanza di training/demo: OGNI skill gira in simulazione (playbook, "Modalità dry-run"). Non metterla su un'istanza operativa.
#
# short_ref_prefix: "PG"          # prefisso degli handle corti delle idee di GOVERNANCE (PG-042),
#                                 # assegnati da backlog-refinement. Default "PG" (Product Governance).
#                                 # NON riusare jira.project_key né una sigla di prodotto/app: PG-042
#                                 # (idea di governance) e EPITA-121 (card del tracker di esecuzione)
#                                 # devono restare visibilmente DUE namespace diversi, o in riunione
#                                 # non si capisce se "{sigla}-42" è un'idea o un ticket. Se vuoi
#                                 # qualcosa di più parlante del default, scegli un token che dica
#                                 # "governance" e non un prodotto (es. "GOV", "PGOV").

# === Connettori a sistemi esterni ===
# Disciplina comune a TUTTI: vedi playbook, "Connettori esterni:
# dichiarati, verificati a inizio processo, mai un fallback silenzioso".
# Campi comuni: configured, integration ("mcp:<server>" | "cli:<nome>" |
# "manuale" | ""), probe (come verificare che sia vivo — per un MCP il
# prefisso dei suoi tool, per una CLI/API un comando o una chiamata
# read-only rapida), reauth (il comando/azione per rimetterlo su quando
# scade — "/mcp" per un MCP, il comando di login per una CLI). MAI
# credenziali qui, solo nomi e comandi.
# NB: il framework non fissa quali connettori esistono — dipende dallo
# stack dell'istanza (il tracker può essere Jira o Asana o Linear; la
# fonte metriche un warehouse, un client SQL, un tool SaaS; ci possono
# essere altri connettori — design, ecc.). I due blocchi sotto sono
# quelli che le skill del framework di base usano; altri vanno in
# `connectors` (in fondo).
# NB: per ogni connettore dichiarato, init-governance-project scrive le
# allow entries dei suoi tool non distruttivi (ricerca/lettura + creazione
# ticket) in .claude/settings.local.json, così le skill non chiedono
# permesso per i passi che il metodo impone (probe, dedup, e per un bug
# confermato l'apertura immediata del ticket). Vedi playbook, "Connettori
# esterni", e la skill init-governance-project, "Cosa scrivere", punto 7.

# --- Tracker di esecuzione (lo usa jira-sync; tipicamente Jira) ---
jira:
  configured: false               # true quando l'istanza ha davvero un tracker collegato
  project_key: ""                 # chiave/prefisso del progetto nel tracker (es. "EPITA")
  board_url: ""                   # URL della board (per i link, non per il polling)
  cloud_id: ""                    # solo Atlassian MCP: id del sito (da getAccessibleAtlassianResources)
  integration: ""                 # "atlassian-mcp" (Remote MCP ufficiale, consigliato per Jira) | "mcp:<server>" | "cli:<nome>" | "manuale" (jira-sync prepara i testi, il PM agisce a mano)
  probe: ""                       # come verificarlo (es. per Atlassian MCP: prefisso "mcp__atlassian__")
  reauth: ""                      # comando per rimetterlo su quando scade (es. "/mcp")
  note: ""                        # note libere (permessi, quirk, tracker non-Jira, ecc.)

# --- Fonte delle metriche (la usano nsm-watch e measurement-watch per
# leggere NSM e KPI dai dati di produzione invece di chiederli al PM) ---
# NB: qui c'è solo la DICHIARAZIONE del connettore. Il contratto di query
# (come una richiesta KPI diventa una query sullo stack dell'istanza e
# torna un aggregato) non esiste ancora — vedi framework/docs/future-work.md.
metrics:
  configured: false               # true quando l'istanza ha davvero una fonte metriche collegata
  integration: ""                 # "" | "manuale" | "mcp:<server>" | "cli:<nome>" | "api:<nome>"
  probe: ""                       # come verificarla (prefisso tool MCP, o un comando/chiamata read-only rapida)
  reauth: ""                      # comando per rimetterla su quando scade. Alcuni connettori (login OAuth interattivo) scadono a OGNI sessione: check-connectors.sh mostra questo comando all'avvio.
  note: ""                        # scope: quali metriche/dataset copre, owner del dato, quirk

# --- Altri connettori (design, SQL ad-hoc, ecc.) — stessa disciplina ---
# Le skill del framework di base non li usano; sono per skill custom o
# future. check-connectors.sh li segnala a inizio sessione.
connectors: []
# - name: ""                      # come lo chiami (es. "figma", "reporting-db")
#   integration: ""               # "mcp:<server>" | "cli:<nome>" | "api:<nome>"
#   probe: ""
#   reauth: ""
#   note: ""

# --- Repository applicativi collegati come submodule ---
apps: []
# Esempio di voce:
# - slug: "checkout-service"
#   path: "apps/checkout-service"
#   note: ""                      # es. "snapshot locale non versionabile — vedi apps/checkout-service/README.md"
