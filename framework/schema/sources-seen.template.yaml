# Template per context/.sources-seen.yaml
#
# Stato di sincronizzazione dei documenti tirati da un connettore sorgente
# di contesto (context-intake, canale "pull da cartelle collegate" — vedi
# playbook, "Contesto aziendale (context/)").
#
# Tracciato da git: è stato condiviso col team, non materiale grezzo — solo
# id + revisione + data, così un run successivo di context-intake propone
# soltanto i documenti nuovi o modificati e non ri-mostra quelli già
# trascritti. Scritto SOLO da context-intake, mai a mano.
#
# Non creato necessariamente durante init-governance-project: lo scaffolda
# init se il PM dichiara almeno una cartella di contesto (connectors[].folders),
# altrimenti lo crea context-intake al primo pull (stesso principio di
# nsm-tracking.yaml).
#
# Nessun contenuto dei documenti vive qui: la sintesi sta in context/*.md,
# la fonte è il link citato lì. Questo file è solo il registro di "cosa ho
# già visto e a che revisione".

documents: []
# Esempio di singola voce:
# - connector: ""        # name del connettore in .governance/config.yaml (connectors[].name)
#   folder: ""           # link della cartella (connectors[].folders[].link)
#   file_id: ""          # id stabile del documento nel sistema sorgente
#   file_name: ""        # nome del documento all'ultima trascrizione (solo lettura umana)
#   revision: ""         # id/hash di revisione, o data-modifica, come esposto dal connettore
#   transcribed_at: ""   # data ISO dell'ultima trascrizione in context/
#   context_file: ""     # quale context/*.md ha ricevuto la sintesi
